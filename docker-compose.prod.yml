networks:
  infra-net:
    external: true
  web:
    name: web
    driver: bridge
    external: true

services:
  notification-api:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
      target: api
    restart: unless-stopped
    networks: [infra-net, web]
    env_file:
      - .env
    environment:
      CONFIG_PATH: /app/config.yml
      MIGRATIONS_DIR: /app/migrations/postgres
    ports:
      - "${HOST_PORT}:${APP_PORT}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.priority=${TRAEFIK_PRIORITY:-25}"
      - "traefik.http.services.${TRAEFIK_ROUTER_NAME}.loadbalancer.server.port=${TRAEFIK_SERVICE_PORT}"
    deploy:
      replicas: 2

  notification-worker-high:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
      target: worker
    restart: unless-stopped
    networks: [infra-net]
    env_file:
      - .env
    environment:
      CONFIG_PATH: /app/config.yml
      QUEUES: high
    command: ["/app/notification-worker", "-queues=high"]
    deploy:
      replicas: 2

  notification-worker-normal:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
      target: worker
    restart: unless-stopped
    networks: [infra-net]
    env_file:
      - .env
    environment:
      CONFIG_PATH: /app/config.yml
      QUEUES: normal
    command: ["/app/notification-worker", "-queues=normal"]

  notification-worker-low:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
      target: worker
    restart: unless-stopped
    networks: [infra-net]
    env_file:
      - .env
    environment:
      CONFIG_PATH: /app/config.yml
      QUEUES: low
    command: ["/app/notification-worker", "-queues=low"]

  notification-outbox:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
      target: outbox
    restart: unless-stopped
    networks: [infra-net]
    env_file:
      - .env
    environment:
      CONFIG_PATH: /app/config.yml
    deploy:
      replicas: 2
