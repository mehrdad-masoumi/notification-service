networks:
  infra-net:
    external: true
  web:
    name: web
    driver: bridge
    external: true

services:
  notification-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: ${CONTAINER_NAME_API:-notification-api}
    restart: unless-stopped
    networks: [infra-net, web]
    env_file:
      - .env
    environment:
      CONFIG_PATH: /app/config.yml
      MIGRATIONS_DIR: /app/migrations/postgres
    ports:
      - "${HOST_PORT}:${APP_PORT}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.priority=${TRAEFIK_PRIORITY:-25}"
      - "traefik.http.services.${TRAEFIK_ROUTER_NAME}.loadbalancer.server.port=${TRAEFIK_SERVICE_PORT}"

  notification-worker-high:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: ${CONTAINER_NAME_WORKER_HIGH:-notification-worker-high}
    restart: unless-stopped
    networks: [infra-net]
    env_file:
      - .env
    environment:
      CONFIG_PATH: /app/config.yml
      QUEUES: high
      NOTIFICATION_WORKER_HEALTH_PORT: "8081"
    command: ["/app/notification-worker", "-queues=high"]

  notification-worker-normal:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: ${CONTAINER_NAME_WORKER_NORMAL:-notification-worker-normal}
    restart: unless-stopped
    networks: [infra-net]
    env_file:
      - .env
    environment:
      CONFIG_PATH: /app/config.yml
      QUEUES: normal
    command: ["/app/notification-worker", "-queues=normal"]

  notification-worker-low:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: ${CONTAINER_NAME_WORKER_LOW:-notification-worker-low}
    restart: unless-stopped
    networks: [infra-net]
    env_file:
      - .env
    environment:
      CONFIG_PATH: /app/config.yml
      QUEUES: low
    command: ["/app/notification-worker", "-queues=low"]
