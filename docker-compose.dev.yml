networks:
  infra-net:
    external: true
  web:
    name: web
    driver: bridge
    external: true

services:
  notification-api:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
      target: api
    container_name: ${CONTAINER_NAME_API:-notification-api}
    restart: unless-stopped
    networks: [infra-net, web]
    env_file:
      - .env
    environment:
      CONFIG_PATH: /app/config.yml
      MIGRATIONS_DIR: /app/migrations/postgres
    # HTTP only on host — gRPC (:9090) is NOT published; reach via Traefik grpc-internal.
    ports:
      - "${HOST_PORT}:${APP_PORT}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # --- Admin HTTPS HTTP API ---
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.rule=Host(`${TRAEFIK_HOST}`) && PathPrefix(`/admin/v1`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.priority=${TRAEFIK_PRIORITY:-25}"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.service=${TRAEFIK_ROUTER_NAME}"
      - "traefik.http.services.${TRAEFIK_ROUTER_NAME}.loadbalancer.server.port=${TRAEFIK_SERVICE_PORT}"
      # User + health routes (broader host rule, lower priority)
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-all.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-all.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-all.priority=${TRAEFIK_PRIORITY_ALL:-20}"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-all.service=${TRAEFIK_ROUTER_NAME}"
      # --- Internal gRPC (h2c) — not on public internet ---
      - "traefik.http.routers.${TRAEFIK_GRPC_ROUTER_NAME}.rule=Host(`${TRAEFIK_GRPC_HOST}`)"
      - "traefik.http.routers.${TRAEFIK_GRPC_ROUTER_NAME}.entrypoints=${TRAEFIK_GRPC_ENTRYPOINT}"
      - "traefik.http.routers.${TRAEFIK_GRPC_ROUTER_NAME}.service=${TRAEFIK_GRPC_ROUTER_NAME}"
      - "traefik.http.services.${TRAEFIK_GRPC_ROUTER_NAME}.loadbalancer.server.port=${TRAEFIK_GRPC_SERVICE_PORT:-9090}"
      - "traefik.http.services.${TRAEFIK_GRPC_ROUTER_NAME}.loadbalancer.server.scheme=h2c"
      - "traefik.http.routers.${TRAEFIK_GRPC_ROUTER_NAME}.middlewares=${TRAEFIK_GRPC_ALLOWLIST_MW:-notification-grpc-allowlist}"
      - "traefik.http.middlewares.notification-grpc-allowlist.ipallowlist.sourcerange=${TRAEFIK_GRPC_ALLOW_CIDRS}"

  notification-worker-high:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
      target: worker
    container_name: ${CONTAINER_NAME_WORKER_HIGH:-notification-worker-high}
    restart: unless-stopped
    networks: [infra-net]
    env_file:
      - .env
    environment:
      CONFIG_PATH: /app/config.yml
      QUEUES: high
      NOTIFICATION_WORKER_HEALTH_PORT: "8081"
    command: ["/app/notification-worker", "-queues=high"]

  notification-worker-normal:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
      target: worker
    container_name: ${CONTAINER_NAME_WORKER_NORMAL:-notification-worker-normal}
    restart: unless-stopped
    networks: [infra-net]
    env_file:
      - .env
    environment:
      CONFIG_PATH: /app/config.yml
      QUEUES: normal
    command: ["/app/notification-worker", "-queues=normal"]

  notification-worker-low:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
      target: worker
    container_name: ${CONTAINER_NAME_WORKER_LOW:-notification-worker-low}
    restart: unless-stopped
    networks: [infra-net]
    env_file:
      - .env
    environment:
      CONFIG_PATH: /app/config.yml
      QUEUES: low
    command: ["/app/notification-worker", "-queues=low"]

  notification-outbox:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
      target: outbox
    container_name: ${CONTAINER_NAME_OUTBOX:-notification-outbox}
    restart: unless-stopped
    networks: [infra-net]
    env_file:
      - .env
    environment:
      CONFIG_PATH: /app/config.yml
