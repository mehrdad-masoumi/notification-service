application:
  env: development
  http_server:
    url: 0.0.0.0
    port: "8080"

postgres:
  host: infra-postgres
  port: 5432
  user: notification
  password: notification
  db: notifications
  ssl: disable

rabbitmq:
  user: guest
  password: guest
  host: infra-rabbitmq
  port: 5672
  vhost: /

auth:
  access_secret: change-me-access-secret
  admin_roles:
    - admin
    - super_admin

internal_api_key: change-me-internal-api-key

email:
  host: ""
  port: 587
  username: ""
  password: ""
  from: noreply@example.com
  timeout_seconds: 10

sms:
  provider: noop
  api_key: ""
  from: ""
  enabled: false

whatsapp:
  provider: noop
  api_key: ""
  from: ""
  enabled: false

push:
  enabled: false
  provider: stub

worker:
  queues:
    - high
    - normal
    - low
  concurrency: 4
  prefetch: 10
  max_retries: 5
  health_port: "8081"

user_service:
  base_url: ""
  api_key: ""
  timeout_seconds: 5
  contacts_path_format: "/internal/users/%s/notification-contacts"

scheduler:
  interval_seconds: 30
  batch_size: 100

outbox:
  batch_size: 50
  poll_interval_ms: 500
  lock_timeout_seconds: 60
  health_port: "8082"
  max_attempts: 20

retention:
  outbox_days: 7
  idempotency_hours: 24
  cleanup_interval_minutes: 60

direct_notification:
  rate_limit_per_minute: 60

batch:
  sync_max_recipients: 100
